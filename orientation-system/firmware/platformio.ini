; ESP32 Orientation System — MPU6500 + BMM150 → Jetson Orin Nano
; Build: /home/head-node-1/.venv-pio/bin/pio run
; Flash: /home/head-node-1/.venv-pio/bin/pio run -t upload

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Host baud per spec §3.1 (115200 for Jetson Orin Nano)
monitor_speed = 115200
upload_speed  = 115200

; Prefer USB-UART over any host serial port
upload_port_filters = ttyUSB, ttyACM

; Include paths — all src subdirs so flat #include works everywhere
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -Wconversion
    -Wshadow
    -Wdouble-promotion
    -Wno-error=conversion
    -Wno-error=shadow
    -Wno-error=float-conversion
    -Wno-error=sign-conversion
    -Isrc/core
    -Isrc/drivers
    -Isrc/fusion
    -Isrc/calibration
    -Isrc/comms
    -Isrc/app

build_unflags =
    -std=gnu++11

[env:wifi_experiment]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_src_filter = -<*> +<../experimental/main_wifi.cpp> +<drivers/> +<core/>
build_flags =
    -I src/drivers
    -I src/core
